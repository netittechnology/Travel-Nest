<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>
      Tour Nest | Admin Panel
    </title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Explore Sri Lanka with Tour Nest. Discover breathtaking tours, adventure experiences, cultural heritage sites, beaches, wildlife safaris, and custom travel packages."
    />
    <meta
      name="keywords"
      content="Sri Lanka tours, travel Sri Lanka, Ceylon tours, Ella, Sigiriya, Kandy, beach tours, safari Sri Lanka, travel agency Sri Lanka, Tour Nest"
    />
    <meta name="author" content="Tour Nest" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#16a34a" />

    <!-- Canonical (important for SEO) -->
    <link rel="canonical" href="https://tournestsrilanka.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tour Nest" />
    <meta
      property="og:title"
      content="Tour Nest | Sri Lanka Travel & Tours"
    />
    <meta
      property="og:description"
      content="Discover Sri Lanka with curated tours, beaches, wildlife safaris, cultural experiences, and custom travel packages."
    />
    <meta property="og:image" content="https://tournestsrilanka.com//logo.png" />
    <meta property="og:url" content="https://tournestsrilanka.com//" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tour Nest" />
    <meta
      name="twitter:description"
      content="Explore Sri Lanka with premium travel experiences and tour packages."
    />
    <meta name="twitter:image" content="https://tournestsrilanka.com//logo.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Tour Nest",
        "url": "https://tournestsrilanka.com",
        "logo": "https://tournestsrilanka.com/logo.png",
        "description": "Sri Lanka travel agency offering tours, safaris, and custom travel experiences."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
